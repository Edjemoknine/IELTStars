services:
  postgres:
    image: postgres:17
    container_name: ielts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts_dev_password
      POSTGRES_DB: ielts
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
